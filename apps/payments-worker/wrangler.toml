name = "ask-thane-payments"
main = "src/index.ts"
compatibility_date = "2026-05-08"

[vars]
BUILD_ENV = "local"
BUILD_GIT_SHA = "dev"
BUILD_DEPLOYED_AT = "local"

[env.staging]
name = "ask-thane-payments-staging"

[env.staging.vars]
BUILD_ENV = "staging"
BUILD_GIT_SHA = "unknown"
BUILD_DEPLOYED_AT = "unknown"

[env.production]
name = "ask-thane-payments"

[env.production.vars]
BUILD_ENV = "production"
BUILD_GIT_SHA = "unknown"
BUILD_DEPLOYED_AT = "unknown"
