name = "ask-thane-api"
main = "src/index.ts"
compatibility_date = "2026-05-08"

[alias]
"@ask-thane/ai" = "../../packages/ai/src/index.ts"
"@ask-thane/data" = "../../packages/data/src/index.ts"
"@ask-thane/domain" = "../../packages/domain/src/index.ts"
"@ask-thane/workflows" = "../../packages/workflows/src/index.ts"

[[d1_databases]]
binding = "DB"
database_name = "ask-thane"
database_id = "186fcae1-759c-45df-a63a-2d68e53cac2d"
migrations_dir = "../../infra/d1/migrations"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@askthane.com"]

[vars]
BUILD_ENV = "local"
BUILD_GIT_SHA = "dev"
BUILD_DEPLOYED_AT = "local"
DEFAULT_LLM_PROVIDER = "openai"
DEFAULT_LLM_MODEL = "gpt-4.1-mini"
THANE_CLI_AUTH_DEV_CODES = "true"
THANE_CLI_EMAIL_FROM = "Thane <noreply@askthane.com>"
THANE_CLI_INVITE_BASE_URL = "http://localhost:8787/invite"
THANE_PAYMENTS_BASE_URL = "http://localhost:8789"
THANE_BOT_INTERNAL_BASE_URL = "http://localhost:8788"

[env.staging]
name = "ask-thane-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ask-thane-staging"
database_id = "02db76d8-728f-40a4-84f8-f17779f8e8de"
migrations_dir = "../../infra/d1/migrations"

[[env.staging.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@askthane.com"]

[env.staging.vars]
BUILD_ENV = "staging"
BUILD_GIT_SHA = "unknown"
BUILD_DEPLOYED_AT = "unknown"
DEFAULT_LLM_PROVIDER = "openai"
DEFAULT_LLM_MODEL = "gpt-4.1-mini"
THANE_CLI_AUTH_DEV_CODES = "true"
THANE_CLI_EMAIL_FROM = "Thane <noreply@askthane.com>"
THANE_CLI_INVITE_BASE_URL = "https://api-staging.askthane.com/invite"
THANE_PAYMENTS_BASE_URL = "https://payments-staging.askthane.com"
THANE_BOT_INTERNAL_BASE_URL = "https://bot-staging.askthane.com"

[[env.staging.routes]]
pattern = "api-staging.askthane.com"
custom_domain = true

[env.production]
name = "ask-thane-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ask-thane"
database_id = "186fcae1-759c-45df-a63a-2d68e53cac2d"
migrations_dir = "../../infra/d1/migrations"

[[env.production.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@askthane.com"]

[env.production.vars]
BUILD_ENV = "production"
BUILD_GIT_SHA = "unknown"
BUILD_DEPLOYED_AT = "unknown"
DEFAULT_LLM_PROVIDER = "openai"
DEFAULT_LLM_MODEL = "gpt-4.1-mini"
THANE_CLI_AUTH_DEV_CODES = "false"
THANE_CLI_EMAIL_FROM = "Thane <noreply@askthane.com>"
THANE_CLI_INVITE_BASE_URL = "https://api.askthane.com/invite"
THANE_PAYMENTS_BASE_URL = "https://payments.askthane.com"
THANE_BOT_INTERNAL_BASE_URL = "https://bot.askthane.com"

[[env.production.routes]]
pattern = "api.askthane.com"
custom_domain = true
