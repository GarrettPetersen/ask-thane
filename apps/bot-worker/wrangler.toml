name = "ask-thane-bot"
main = "src/index.ts"
compatibility_date = "2026-05-08"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ask-thane"
database_id = "186fcae1-759c-45df-a63a-2d68e53cac2d"
migrations_dir = "../../infra/d1/migrations"

[vars]
BUILD_ENV = "local"
BUILD_GIT_SHA = "dev"
BUILD_DEPLOYED_AT = "local"
DEFAULT_LLM_PROVIDER = "openai"
DEFAULT_LLM_MODEL = "gpt-5.4-mini"
FREE_TIER_LLM_MODEL = "gpt-4.1-mini"
PAID_TIER_LLM_MODEL = "gpt-5.4-mini"
TEAM_TIER_LLM_MODEL = "gpt-5.4-mini"
GROWTH_TIER_LLM_MODEL = "gpt-5.4"
SCALE_TIER_LLM_MODEL = "gpt-5.5"
SCALE_PLUS_TIER_LLM_MODEL = "gpt-5.5"
PAID_TIER_DIGEST_LLM_MODEL = "gpt-5.4-mini"
FREE_TIER_MONTHLY_AI_CAP_USD = "10"
SUBSCRIPTION_PAGE_URL = "https://payments.askthane.com/subscribe"
DEFAULT_ORGANIZATION_ID = "org_0"
THANE_BASE_URL = "https://askthane.com"
SLACK_BOT_SCOPES = "users:read,users:read.email,app_mentions:read,channels:history,channels:join,channels:read,chat:write,chat:write.public,groups:history,groups:read,im:history,im:read,im:write,mpim:history,mpim:read,reactions:read,reactions:write,team:read"
SLACK_REDIRECT_URI = "https://bot.askthane.com/slack/oauth/callback"
AGENT_MAX_TOOL_TURNS = "8"
AGENT_COMPLETION_RETRIES = "2"
AGENT_TOOL_READ_LIMIT = "100"
AGENT_COMPLETION_TIMEOUT_MS = "45000"
OPENAI_PRICING_VERSION = "unset"
OPENAI_PRICE_PROMPT_PER_1K_USD = ""
OPENAI_PRICE_COMPLETION_PER_1K_USD = ""
OPENAI_ORGANIZATION_ID = ""
OPENAI_COST_RECONCILIATION_ENABLED = "true"
OPENAI_RECON_ALERT_THRESHOLD_PCT = "10"

[env.staging]
name = "ask-thane-bot-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ask-thane-staging"
database_id = "02db76d8-728f-40a4-84f8-f17779f8e8de"
migrations_dir = "../../infra/d1/migrations"

[env.staging.vars]
BUILD_ENV = "staging"
BUILD_GIT_SHA = "unknown"
BUILD_DEPLOYED_AT = "unknown"
DEFAULT_LLM_PROVIDER = "openai"
DEFAULT_LLM_MODEL = "gpt-5.4-mini"
FREE_TIER_LLM_MODEL = "gpt-4.1-mini"
PAID_TIER_LLM_MODEL = "gpt-5.4-mini"
TEAM_TIER_LLM_MODEL = "gpt-5.4-mini"
GROWTH_TIER_LLM_MODEL = "gpt-5.4"
SCALE_TIER_LLM_MODEL = "gpt-5.5"
SCALE_PLUS_TIER_LLM_MODEL = "gpt-5.5"
PAID_TIER_DIGEST_LLM_MODEL = "gpt-5.4-mini"
FREE_TIER_MONTHLY_AI_CAP_USD = "10"
SUBSCRIPTION_PAGE_URL = "https://payments.askthane.com/subscribe"
DEFAULT_ORGANIZATION_ID = "org_0"
THANE_BASE_URL = "https://askthane.com"
SLACK_BOT_SCOPES = "users:read,users:read.email,app_mentions:read,channels:history,channels:join,channels:read,chat:write,chat:write.public,groups:history,groups:read,im:history,im:read,im:write,mpim:history,mpim:read,reactions:read,reactions:write,team:read"
SLACK_REDIRECT_URI = "https://bot-staging.askthane.com/slack/oauth/callback"
AGENT_MAX_TOOL_TURNS = "8"
AGENT_COMPLETION_RETRIES = "2"
AGENT_TOOL_READ_LIMIT = "100"
AGENT_COMPLETION_TIMEOUT_MS = "45000"
OPENAI_PRICING_VERSION = "unset"
OPENAI_PRICE_PROMPT_PER_1K_USD = ""
OPENAI_PRICE_COMPLETION_PER_1K_USD = ""
OPENAI_ORGANIZATION_ID = ""
OPENAI_COST_RECONCILIATION_ENABLED = "true"
OPENAI_RECON_ALERT_THRESHOLD_PCT = "10"

[[env.staging.routes]]
pattern = "bot-staging.askthane.com"
custom_domain = true

