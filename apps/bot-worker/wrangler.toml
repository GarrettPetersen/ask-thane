name = "ask-thane-bot"
main = "src/index.ts"
compatibility_date = "2026-05-08"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ask-thane"
database_id = "186fcae1-759c-45df-a63a-2d68e53cac2d"

[vars]
DEFAULT_LLM_PROVIDER = "openai"
DEFAULT_LLM_MODEL = "gpt-4.1-mini"
DEFAULT_ORGANIZATION_ID = "org_0"
THANE_BASE_URL = "https://askthane.com"
SLACK_BOT_SCOPES = "channels:history,groups:history,channels:read,groups:read,im:read,mpim:read,chat:write,chat:write.public,im:write,reactions:write"
SLACK_REDIRECT_URI = "https://bot.askthane.com/slack/oauth/callback"

[[routes]]
pattern = "bot.askthane.com"
custom_domain = true
