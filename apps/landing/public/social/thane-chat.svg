<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Thane Chat</title>
  <desc id="desc">A chat app your agents can use as easily as you can.</desc>
  <rect width="1200" height="630" fill="#050505" />
  <rect x="72" y="72" width="1056" height="486" rx="24" fill="#050505" stroke="#ffffff" stroke-width="2" />
