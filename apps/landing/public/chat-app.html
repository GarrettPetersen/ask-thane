<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thane Chat</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #d9e7dc;
        --muted: #819286;
        --quiet: #526055;
        --panel: #101612;
        --panel-2: #151d18;
        --line: #2f3b33;
        --field: #080c09;
        --green: #7aff9f;
        --amber: #ffc857;
        --cyan: #7dd3fc;
        --danger: #ff7a90;
        --shadow: rgba(0, 0, 0, 0.4);
        --rail-closed: 46px;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(rgba(122, 255, 159, 0.025) 1px, transparent 1px),
          #070a08;
        background-size: 100% 4px, auto;
        color: var(--ink);
      }

      button, input, textarea, select {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        background: #0a0f0c;
        color: var(--ink);
        min-height: 34px;
        padding: 0 12px;
        cursor: pointer;
      }

      button:hover { border-color: var(--green); color: var(--green); }
      button:disabled { color: var(--quiet); cursor: default; border-color: #202820; }
      input, textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--field);
        color: var(--ink);
        padding: 10px 11px;
        outline: none;
      }
      input:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 1px rgba(122, 255, 159, 0.18); }
      textarea { resize: none; min-height: 44px; max-height: 140px; }

      .app {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr) 310px;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        border: 1px solid rgba(122, 255, 159, 0.18);
      }
      .app.sidebar-collapsed {
        grid-template-columns: var(--rail-closed) minmax(0, 1fr) 310px;
      }

      .rail, .side, .main {
        min-height: 0;
        height: 100%;
      }
      .rail, .side {
        background: rgba(7, 12, 9, 0.96);
        border-right: 1px solid var(--line);
        overflow: auto;
      }
      .side { border-right: 0; border-left: 1px solid var(--line); }
      .rail {
        position: relative;
      }

      .brand {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }
      .sig {
        color: var(--green);
        white-space: pre;
        line-height: 1.05;
        font-size: 11px;
        margin-bottom: 12px;
        min-height: 108px;
      }
      .rail-tab {
        display: none;
        width: 100%;
        min-height: 100vh;
        padding: 10px 0;
        color: var(--green);
        background: transparent;
        border: 0;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        letter-spacing: 0;
      }
      .sidebar-collapsed .rail {
        overflow: hidden;
      }
      .sidebar-collapsed .rail-tab {
        display: block;
      }
      .sidebar-collapsed .brand,
      .sidebar-collapsed .section {
        display: none;
      }
      .title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
      }
      h1, h2, h3, p { margin: 0; }
      h1 { font-size: 16px; color: var(--ink); }
      .state { color: var(--amber); font-size: 11px; }
      .muted { color: var(--muted); }
      .small { font-size: 12px; }

      .section {
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }
      .section-toggle {
        width: 100%;
        border-color: transparent;
        background: transparent;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 8px;
        align-items: center;
        text-align: left;
        padding: 0 4px;
      }
      .section-toggle .summary {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-transform: none;
      }
      .menu-caret {
        color: var(--amber);
      }
      .list { display: grid; gap: 6px; }
      .item {
        width: 100%;
        text-align: left;
        display: block;
        min-height: 34px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: transparent;
        border-color: transparent;
      }
      .item.active {
        border-color: var(--green);
        color: var(--green);
        background: rgba(122, 255, 159, 0.06);
      }
      .item .cursor {
        color: var(--amber);
      }

      .main {
        display: grid;
        grid-template-rows: auto auto 1fr auto auto;
        min-width: 0;
        min-height: 0;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: #070a08;
      }
      .topbar-left {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-button {
        width: 34px;
        padding: 0;
        text-align: center;
      }
      .channel-name { font-size: 16px; color: var(--ink); }
      .prompt-line {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .messages {
        overflow: auto;
        min-height: 0;
        padding: 8px 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .message {
        border: 0;
        border-left: 0;
        background: transparent;
        box-shadow: none;
        padding: 2px 0;
        font-size: 13px;
        position: relative;
      }
      .message.reply {
        margin-left: 0;
        border-left: 0;
        background: transparent;
      }
      .message.system-event {
        color: var(--muted);
      }
      .message.system-event .message-meta {
        color: var(--quiet);
      }
      .message-meta {
        display: inline;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 0;
      }
      .message-author { color: var(--cyan); }
      .message-text {
        display: inline;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.45;
      }
      .thread-count {
        color: var(--amber);
        font-size: 12px;
        margin-left: 22px;
      }
      .message-actions {
        position: absolute;
        right: 0;
        top: -2px;
        display: flex;
        gap: 4px;
        opacity: 0;
        pointer-events: none;
        background: #070a08;
        padding-left: 8px;
      }
      .message:hover .message-actions,
      .message:focus-within .message-actions,
      .message.show-reactions .message-actions {
        opacity: 1;
        pointer-events: auto;
      }
      .message-action {
        min-height: 24px;
        min-width: 28px;
        padding: 0 7px;
        border-color: #263229;
        color: var(--muted);
        background: #070a08;
        line-height: 1;
      }
      .reaction-menu {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: 10px;
        padding: 2px 4px;
        border: 1px solid var(--line);
        background: #070a08;
        vertical-align: middle;
      }
      .reaction-menu button {
        min-height: 26px;
        min-width: 28px;
        padding: 0 5px;
      }
      .reaction-custom {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .reaction-custom input {
        width: 48px;
        min-height: 26px;
        padding: 2px 5px;
      }
      .msg-marker {
        color: var(--muted);
      }
      .msg-branch {
        color: var(--muted);
        margin-left: 4ch;
      }
      .composer {
        border-top: 0;
        padding: 6px 12px 10px;
        background: rgba(7, 10, 8, 0.92);
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: end;
      }
      .prompt-symbol {
        color: var(--green);
        min-height: 44px;
        display: grid;
        align-items: center;
      }
      .composer-wrap {
        border-top: 1px solid var(--line);
        background: rgba(7, 10, 8, 0.92);
        position: sticky;
        bottom: 0;
        z-index: 10;
        box-shadow: 0 -12px 28px rgba(0, 0, 0, 0.24);
        min-height: 69px;
      }
      .composer-wrap .composer {
        border-top: 0;
      }
      .composer textarea {
        display: block;
        min-height: 44px;
        border-color: transparent;
        background: transparent;
        padding-left: 0;
      }
      .composer textarea:focus { border-color: transparent; box-shadow: none; }
      .statusbar {
        border-top: 1px solid var(--line);
        padding: 6px 12px;
        color: var(--muted);
        background: #070a08;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
      }
      .statusbar strong {
        color: var(--green);
        font-weight: 400;
      }
      .top-rule {
        height: 1px;
        background: var(--line);
      }
      .reply-target {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        padding: 10px 12px 0;
        color: var(--amber);
        font-size: 12px;
      }

      .login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 22px;
      }
      .login-card {
        width: min(560px, 100%);
        border: 1px solid var(--line);
        background: rgba(16, 22, 18, 0.94);
        box-shadow: 0 30px 80px var(--shadow);
      }
      .login-card .brand { border-bottom: 1px solid var(--line); }
      .login-form { padding: 18px; display: grid; gap: 12px; }
      .row { display: grid; gap: 7px; }
      label { color: var(--muted); font-size: 12px; }
      .error { color: var(--danger); min-height: 18px; }
      .ok { color: var(--green); }

      .side .section { border-bottom: 1px solid var(--line); }
      .kv { display: grid; gap: 8px; font-size: 12px; color: var(--muted); }
      .cmdline {
        border: 1px solid var(--line);
        background: var(--field);
        padding: 10px;
        color: var(--green);
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .qr-card {
        width: fit-content;
        max-width: 100%;
        border: 1px solid var(--line);
        background: #ffffff;
        padding: 10px;
      }
      .qr-card svg {
        display: block;
        width: min(220px, 100%);
        height: auto;
      }
      .empty {
        border: 0;
        color: var(--muted);
        padding: 0;
        text-align: left;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(2, 5, 3, 0.76);
      }
      .modal {
        width: min(720px, 100%);
        max-height: min(760px, calc(100vh - 36px));
        overflow: auto;
        border: 1px solid var(--green);
        background: #070a08;
        box-shadow: 0 30px 90px var(--shadow);
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 14px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .modal-title { display: grid; gap: 5px; }
      .modal h2 { font-size: 16px; color: var(--green); }
      .modal-body { padding: 16px; display: grid; gap: 14px; }
      .terminal-lines {
        border: 1px solid var(--line);
        background: var(--field);
        padding: 12px;
        display: grid;
        gap: 7px;
      }
      .terminal-lines code {
        color: var(--green);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .modal-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .note-grid {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .menu-stack {
        display: grid;
        gap: 8px;
      }
      .menu-button {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        text-align: left;
      }
      .menu-button span:last-child {
        color: var(--amber);
      }
      .settings-grid {
        display: grid;
        gap: 18px;
      }
      .settings-group {
        display: grid;
        gap: 10px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .settings-group:first-child {
        padding-top: 0;
        border-top: 0;
      }
      .settings-group h3 {
        color: var(--green);
        font-size: 13px;
        font-weight: 400;
      }

      @media (max-width: 980px) {
        .app { grid-template-columns: 230px minmax(0, 1fr); }
        .app.sidebar-collapsed { grid-template-columns: var(--rail-closed) minmax(0, 1fr); }
        .side { display: none; }
      }
      @media (max-width: 720px) {
        body { overflow: auto; }
        .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; }
        .app.sidebar-collapsed { grid-template-columns: 1fr; }
        .sidebar-collapsed .rail { display: none; }
        .side { display: none; }
        .rail { min-height: auto; border-right: 0; }
        .rail, .main { height: auto; }
        .main { min-height: 72vh; }
        .brand { padding: 14px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const API = "https://api.askthane.com";
      const freeLimits = { members: 100, privateChannels: 10 };
      const storageKey = "thane.web.session";
      const realtimeEnabled = localStorage.getItem("thane.web.realtime") !== "false";
      const root = document.querySelector("#root");
      const inviteMatch = location.pathname.match(/^\/invite\/([^/?#]+)/);
      const inviteEmail = new URLSearchParams(location.search).get("email") || "";
      const initialSession = JSON.parse(localStorage.getItem(storageKey) || "null");

      function memoryScope(session) {
        return encodeURIComponent(session?.id || session?.email || "anonymous");
      }

      function accountMemoryKey(name, session = state.session) {
        return `thane.web.${memoryScope(session)}.${name}`;
      }

      function workspaceMemoryKey(workspaceId, name, session = state.session) {
        return `thane.web.${memoryScope(session)}.workspace.${workspaceId}.${name}`;
      }

      function recall(key) {
        try {
          return localStorage.getItem(key) || "";
        } catch (_error) {
          return "";
        }
      }

      const initialWorkspaceId = recall(accountMemoryKey("activeWorkspaceId", initialSession));
      const state = {
        session: initialSession,
        authStep: "email",
        email: inviteEmail,
        mfaChallengeToken: "",
        mfaStatus: null,
        mfaStatusLoading: false,
        mfaSetup: null,
        inviteToken: inviteMatch ? decodeURIComponent(inviteMatch[1]) : "",
        invitePreview: null,
        inviteAccepted: false,
        autoLoginStarted: false,
        snapshot: null,
        activeWorkspaceId: initialWorkspaceId,
        activeChannelId: initialWorkspaceId ? recall(workspaceMemoryKey(initialWorkspaceId, "activeChannelId", initialSession)) : "",
        replyToId: "",
        reactionMenuMessageId: "",
        longPressTimer: null,
        touchMoved: false,
        inviteLinkResult: null,
        billingBusy: false,
        workspaceProfileDraft: null,
        workspaceHandleDraft: null,
        accountProfileDraft: null,
        pendingHandle: "",
        searchQuery: "",
        draftText: "",
        sidebarCollapsed: localStorage.getItem("thane.web.sidebarCollapsed") === "true",
        workspaceMenuOpen: localStorage.getItem("thane.web.workspaceMenuOpen") === "true",
        channelMenuOpen: localStorage.getItem("thane.web.channelMenuOpen") === "true",
        cliInstallOpen: false,
        settingsMenuOpen: false,
        settingsMenuScrollTop: 0,
        realtimeSocket: null,
        realtimeWorkspaceId: "",
        realtimeReconnectTimer: null,
        realtimeBackoffMs: 1000,
        realtimeStatus: "polling",
        realtimeSyncing: false,
        status: "",
        error: "",
        busy: false
      };

      function saveSession(session) {
        state.session = session;
        if (session) localStorage.setItem(storageKey, JSON.stringify(session));
        else localStorage.removeItem(storageKey);
      }

      function remember(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (_error) {
          // Keep controls responsive even when storage is unavailable.
        }
      }

      function rememberAccountSelection() {
        if (!state.session?.authToken || !state.activeWorkspaceId) return;
        remember(accountMemoryKey("activeWorkspaceId"), state.activeWorkspaceId);
      }

      function rememberChannelSelection() {
        if (!state.session?.authToken || !state.activeWorkspaceId || !state.activeChannelId) return;
        remember(workspaceMemoryKey(state.activeWorkspaceId, "activeChannelId"), state.activeChannelId);
      }

      function rememberNavigationSelection() {
        rememberAccountSelection();
        rememberChannelSelection();
      }

      async function api(path, options = {}) {
        const headers = { "content-type": "application/json", ...(options.headers || {}) };
        if (state.session?.authToken) headers.authorization = `Bearer ${state.session.authToken}`;
        const res = await fetch(`${API}${path}`, { ...options, headers });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || body.ok === false) {
          if (body.error === "rate_limited" && body.retryAfterSeconds) {
            throw new Error(`rate_limited: try again in ${body.retryAfterSeconds}s`);
          }
          throw new Error(body.error || `HTTP ${res.status}`);
        }
        return body;
      }

      async function previewInvite() {
        if (!state.inviteToken || state.invitePreview) return;
        const body = await api(`/v1/thane-cli/workspace-invites/${encodeURIComponent(state.inviteToken)}`, {
          headers: { "content-type": "application/json" }
        });
        state.invitePreview = body.invite;
        if (body.invite?.inviteeEmail && !state.email) {
          state.email = body.invite.inviteeEmail;
        }
      }

      async function autoStartInviteLogin() {
        if (!state.inviteToken || state.session?.authToken || state.authStep !== "email" || state.autoLoginStarted || !state.email) {
          return;
        }
        state.autoLoginStarted = true;
        await requestLoginCodeForEmail(state.email);
      }

      async function acceptPendingInvite() {
        if (!state.inviteToken || !state.session?.authToken || state.inviteAccepted) return false;
        const body = await api("/v1/thane-cli/workspace-invites/accept", {
          method: "POST",
          body: JSON.stringify({ token: state.inviteToken })
        });
        state.inviteAccepted = true;
        state.activeWorkspaceId = body.workspace?.id || state.activeWorkspaceId;
        state.activeChannelId = "";
        state.replyToId = "";
        state.status = `Joined ${body.workspace?.slug || "workspace"}`;
        history.replaceState(null, "", "/");
        await sync();
        return true;
      }

      async function finishSignIn(account) {
        saveSession(account);
        if (state.inviteToken) {
          await acceptPendingInvite();
        } else {
          await sync();
        }
        await applyPendingHandle();
      }

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      }
      function jsString(value) {
        return JSON.stringify(String(value ?? "")).replace(/</g, "\\u003c");
      }
      function time(value) {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? value : date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }
      function currentSnapshot() {
        return state.snapshot || { workspaces: [], channels: [], messages: [], users: [] };
      }

      function currentChannel() {
        const snap = currentSnapshot();
        return snap.channels.find((item) => item.id === state.activeChannelId) || snap.channels[0];
      }

      function currentMessages() {
        const channel = currentChannel();
        return (currentSnapshot().messages || []).filter((message) => message.channelId === channel?.id);
      }

      function currentWorkspaceRole() {
        const snap = currentSnapshot();
        const user = currentUser();
        return (snap.workspaceMembers || []).find((member) => member.userId === user?.id)?.role || "";
      }

      function canAdminWorkspace() {
        const role = currentWorkspaceRole();
        return role === "owner" || role === "admin";
      }

      function memberRoleForUser(user) {
        const snap = currentSnapshot();
        return (snap.workspaceMembers || []).find((member) => member.userId === user?.id)?.role || "member";
      }

      function currentUser() {
        const snap = currentSnapshot();
        return (snap.users || []).find((user) => user.email === state.session?.email || user.accountId === state.session?.id);
      }

      function currentChannelMembers() {
        const snap = currentSnapshot();
        const channel = currentChannel();
        const ids = new Set(channel?.memberIds || []);
        return (snap.users || []).filter((user) => ids.has(user.id));
      }

      function renderMemberRows(users, options = {}) {
        const snap = currentSnapshot();
        const activeUser = currentUser();
        const isAdmin = canAdminWorkspace();
        const channel = currentChannel();
        const channelMemberIds = new Set(channel?.memberIds || []);
        const includeChannelControls = options.includeChannelControls !== false;
        return users.map((user) => {
          const memberRole = memberRoleForUser(user);
          const target = user.email || user.handle;
          const canManage = isAdmin && user.id !== activeUser?.id;
          const inChannel = channelMemberIds.has(user.id);
          const emailText = isAdmin && user.email ? ` - ${esc(user.email)}` : "";
          return `<div class="item">${esc(user.displayName || user.handle)} @${esc(user.handle)} (${esc(memberRole)})${emailText}${canManage ? ` <button onclick="setWorkspaceMemberRole(${jsString(target)}, ${jsString(memberRole === "admin" ? "member" : "admin")})">${memberRole === "admin" ? "make member" : "make admin"}</button>${includeChannelControls && inChannel ? ` <button onclick="removeChannelMember(${jsString(target)})">channel remove</button>` : ""} <button onclick="removeWorkspaceMember(${jsString(target)}, false)">kick</button> <button onclick="removeWorkspaceMember(${jsString(target)}, true)">ban</button>` : ""}</div>`;
        }).join("") || `<div class="muted small">No members</div>`;
      }

      function currentBillingPlan(workspaceId) {
        const snap = currentSnapshot();
        return (snap.billingPlans || []).find((plan) => plan.workspaceId === workspaceId) || {
          workspaceId,
          planTier: "free",
          status: "active"
        };
      }

      function reactionGroups(message) {
        const groups = new Map();
        for (const reaction of message.reactions || []) {
          const group = groups.get(reaction.emoji) || { emoji: reaction.emoji, count: 0, by: [] };
          group.count += 1;
          if (reaction.by) group.by.push(reaction.by);
          groups.set(reaction.emoji, group);
        }
        return [...groups.values()];
      }

      function hashString(value) {
        let hash = 2166136261;
        for (let index = 0; index < value.length; index += 1) {
          hash ^= value.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function workspaceInitials(workspace) {
        const source = workspace?.name || workspace?.slug || "chat";
        const words = source.split(/[^a-zA-Z0-9]+/).filter(Boolean);
        return (words.length > 1 ? words.map((word) => word[0]).join("") : source).slice(0, 4).toUpperCase();
      }

      function generatedCrest(workspace) {
        const width = 24;
        const innerWidth = Math.min(width - 2, 22);
        const seed = `${workspace?.id || "web"}:${workspace?.slug || "chat"}:${workspace?.name || "Thane Chat"}`;
        const hash = hashString(seed);
        const glyphs = [" ", ".", ":", "+", "*", "#"];
        const motifRows = Array.from({ length: 4 }, (_, row) => {
          const left = Array.from({ length: 4 }, (_, column) => {
            const shift = (row * 7 + column * 5) % 24;
            return glyphs[(hash >>> shift) % glyphs.length] || " ";
          });
          return [...left, glyphs[(hash >>> ((row * 11) % 24)) % glyphs.length] || " ", ...left.slice().reverse()].join("");
        });
        const initials = ` ${workspaceInitials(workspace)} `;
        const titleLine = `${initials}${" ".repeat(Math.max(0, innerWidth - initials.length))}`.slice(0, innerWidth);
        const artPad = Math.max(0, Math.floor((innerWidth - motifRows[0].length) / 2));
        return [
          `.${"-".repeat(innerWidth)}.`,
          `|${titleLine}|`,
          ...motifRows.map((row) => `|${`${" ".repeat(artPad)}${row}`.padEnd(innerWidth, " ").slice(0, innerWidth)}|`),
          `'${"-".repeat(innerWidth)}'`,
          workspace?.slug || "chat",
          ""
        ].join("\n");
      }

      function workspaceCrest(workspace) {
        return (workspace?.asciiArt || "").trim() || generatedCrest(workspace);
      }

      async function sync() {
        if (!state.session?.authToken) return;
        const workspaceId = state.activeWorkspaceId ? `?workspaceId=${encodeURIComponent(state.activeWorkspaceId)}` : "";
        const snapshot = await api(`/v1/thane-cli/sync${workspaceId}`);
        state.snapshot = snapshot;
        const workspaces = snapshot.workspaces || [];
        const channels = snapshot.channels || [];
        const requestedWorkspaceId = state.activeWorkspaceId;
        const requestedWorkspaceExists = workspaces.some((workspace) => workspace.id === requestedWorkspaceId);
        state.activeWorkspaceId = requestedWorkspaceExists ? requestedWorkspaceId : snapshot.activeWorkspaceId || workspaces[0]?.id || "";

        const rememberedChannelId = state.activeWorkspaceId
          ? recall(workspaceMemoryKey(state.activeWorkspaceId, "activeChannelId"))
          : "";
        const requestedChannelId = state.activeChannelId;
        const requestedChannelExists = channels.some((channel) => channel.id === requestedChannelId);
        const rememberedChannelExists = channels.some((channel) => channel.id === rememberedChannelId);
        if (requestedChannelExists) {
          state.activeChannelId = requestedChannelId;
        } else if (rememberedChannelExists) {
          state.activeChannelId = rememberedChannelId;
        } else {
          state.activeChannelId = channels.find((channel) => channel.name === "general")?.id || channels[0]?.id || "";
        }
        rememberNavigationSelection();
        connectRealtime();
      }

      async function syncFromRealtime() {
        if (state.realtimeSyncing) return;
        state.realtimeSyncing = true;
        try {
          await sync();
          render();
        } catch (_error) {
          state.realtimeStatus = "polling";
        } finally {
          state.realtimeSyncing = false;
        }
      }

      function realtimeUrl(workspaceId) {
        const params = new URLSearchParams({
          workspaceId,
          authToken: state.session.authToken
        });
        return `${API}/v1/thane-cli/events?${params}`;
      }

      function connectRealtime() {
        if (!realtimeEnabled) {
          state.realtimeStatus = "polling";
          return;
        }
        if (!state.session?.authToken || !state.activeWorkspaceId || !("EventSource" in window)) {
          state.realtimeStatus = "polling";
          return;
        }
        if (state.realtimeSocket && state.realtimeWorkspaceId === state.activeWorkspaceId && state.realtimeSocket.readyState !== EventSource.CLOSED) {
          return;
        }
        if (state.realtimeSocket) {
          state.realtimeSocket.close();
        }
        if (state.realtimeReconnectTimer) {
          clearTimeout(state.realtimeReconnectTimer);
          state.realtimeReconnectTimer = null;
        }
        const workspaceId = state.activeWorkspaceId;
        const source = new EventSource(realtimeUrl(workspaceId));
        state.realtimeSocket = source;
        state.realtimeWorkspaceId = workspaceId;
        state.realtimeStatus = "connecting";
        source.addEventListener("open", () => {
          state.realtimeBackoffMs = 1000;
          state.realtimeStatus = "live";
          if (!state.settingsMenuOpen) render();
        });
        source.addEventListener("message", (event) => {
          let payload = null;
          try {
            payload = JSON.parse(event.data);
          } catch (_error) {
            return;
          }
          if (payload?.type === "connected") return;
          if (payload?.workspaceId === state.activeWorkspaceId) {
            void syncFromRealtime();
          }
        });
        source.addEventListener("error", () => {
          if (state.realtimeSocket !== source) return;
          state.realtimeStatus = "polling";
          if (source.readyState === EventSource.CLOSED) {
            const delay = state.realtimeBackoffMs;
            state.realtimeBackoffMs = Math.min(state.realtimeBackoffMs * 2, 30000);
            state.realtimeReconnectTimer = setTimeout(() => connectRealtime(), delay);
          }
          if (!state.settingsMenuOpen) render();
        });
      }

        } catch (error) {
          state.error = error.message;
        } finally {
          render();
        }
      }

      function mfaStatusLabel() {
        if (state.mfaStatusLoading) return "checking";
        if (state.mfaSetup) return "setup in progress";
        if (state.mfaStatus === "enabled") return "set up";
        if (state.mfaStatus === "disabled") return "not set up";
        if (state.mfaStatus === "unavailable") return "unavailable";
        return "unknown";
      }

      async function refreshMfaStatus() {
        state.mfaStatusLoading = true;
        if (!state.mfaStatus || state.mfaStatus === "unknown") {
          state.mfaStatus = "checking";
        }
        render();
        try {
          const body = await api("/v1/thane-cli/mfa/status", { method: "GET" });
          state.mfaStatus = body.enabled ? "enabled" : "disabled";
          state.error = "";
        } catch (error) {
          state.mfaStatus = "unavailable";
          state.error = error.message;
        } finally {
          state.mfaStatusLoading = false;
          render();
        }
      }

      async function startMfaSetup() {
        try {
          const body = await api("/v1/thane-cli/mfa/setup/start", { method: "POST", body: JSON.stringify({}) });
          state.mfaSetup = body;
          state.mfaStatus = "setup";
          state.error = "";
        } catch (error) {
          state.error = error.message;
        } finally {
          render();
        }
      }

      async function verifyMfaSetup(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const code = String(form.get("code") || "").trim();
        if (!state.mfaSetup?.factorId || !code) return;
        try {
          const body = await api("/v1/thane-cli/mfa/setup/verify", {
            method: "POST",
            body: JSON.stringify({ factorId: state.mfaSetup.factorId, code })
          });
          state.mfaSetup = null;
          state.mfaStatus = body.enabled ? "enabled" : "disabled";
          state.status = body.enabled ? "MFA enabled" : "MFA setup incomplete";
          state.error = "";
        } catch (error) {
          state.error = error.message;
        } finally {
          render();
        }
      }

      async function disableMfa(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const code = String(form.get("code") || "").trim();
        if (!code) return;
        try {
          await api("/v1/thane-cli/mfa/disable", {
            method: "POST",
            body: JSON.stringify({ code })
          });
          state.mfaSetup = null;
          state.mfaStatus = "disabled";
          state.status = "MFA disabled";
          state.error = "";
        } catch (error) {
          state.error = error.message;
        } finally {
          render();
        }
      }

      function parseExpiresInput(value) {
        const match = String(value || "").trim().toLowerCase().match(/^(\d+)\s*([hd])?$/);
        if (!match) return 24 * 7;
        const amount = Number(match[1]);
        return match[2] === "h" ? amount : amount * 24;
      }

      async function copyText(value, label) {
        try {
          await navigator.clipboard.writeText(value);
          state.status = `${label} copied`;
        } catch (_error) {
          state.status = value;
        }
        render();
      }

      function userDisplayLabel(user) {
        return user?.displayName?.trim() || (user?.handle ? `@${user.handle}` : "unknown");

      function isWorkspaceJoinMessage(message) {
        return String(message?.id || "").startsWith("evt_join_") || String(message?.id || "").startsWith("tjoin_");
      }

      function renderMessage(message, users, repliesByRoot, isReply = false) {
        const user = users.get(message.authorId);
        const replies = repliesByRoot.get(message.id) || [];
        const stamp = time(message.createdAt);
        if (isWorkspaceJoinMessage(message)) {
          return `<article class="message system-event">
            <span class="message-meta"><span class="msg-marker">  ${esc(stamp)}</span> * </span><span class="message-text">${esc(message.text)}</span>
          </article>`;
        }
        const branch = isReply ? `<span class="msg-branch">└─</span> ` : "";
        const author = userDisplayLabel(user);
        const sourceMarker = message.source === "terminal" ? " 🤖" : "";
        const reactionText = (message.reactions || []).map((reaction) => reaction.emoji).join(" ");
        const menuOpen = state.reactionMenuMessageId === message.id;
        const quickReactions = ["👍", "❤️", "😂", "🎉", "👀"];
        return `<article class="message ${isReply ? "reply" : ""} ${menuOpen ? "show-reactions" : ""}" ontouchstart="startLongPress(event, ${jsString(message.id)})" ontouchmove="markTouchMoved()" ontouchend="cancelLongPress()" ontouchcancel="cancelLongPress()" oncontextmenu="openReactionMenu(event, ${jsString(message.id)})">
          <span class="message-meta">${branch}<span class="msg-marker">  ${esc(stamp)}</span> <span class="message-author">${esc(author)}${sourceMarker}</span>: </span><span class="message-text">${esc(message.text)}</span>${replies.length && !isReply ? `<span class="thread-count"> (${replies.length} repl${replies.length === 1 ? "y" : "ies"})</span>` : ""}${reactionText ? `<span class="thread-count"> ${esc(reactionText)}</span>` : ""}
          <span class="message-actions"><button class="message-action" title="React" onclick="openReactionMenu(event, ${jsString(message.id)})">+</button>${!isReply ? `<button class="message-action" title="Reply" onclick="event.stopPropagation(); replyTo(${jsString(message.id)})">↵</button>` : ""}</span>
          ${menuOpen ? `<span class="reaction-menu">${quickReactions.map((emoji) => `<button onclick="reactTo(${jsString(message.id)}, ${jsString(emoji)})">${esc(emoji)}</button>`).join("")}<form class="reaction-custom" onsubmit="customReaction(event, ${jsString(message.id)})"><input name="emoji" maxlength="12" placeholder="+"/><button>ok</button></form><button title="Close" onclick="closeReactionMenu()">x</button></span>` : ""}
          ${!isReply && replies.length ? replies.map((reply) => renderMessage(reply, users, repliesByRoot, true)).join("") : ""}
        </article>`;
      }

                  <input name="search" value="${esc(state.searchQuery)}" oninput="updateSearch(this.value)" placeholder="Search messages" />
                  <button>Search messages</button>
                  ${searchQuery ? `<div class="kv">${searchResults.length ? searchResults.map((message) => `<button type="button" class="item" onclick="openSearchResult(${jsString(message.channelId)})">#${esc(snap.channels.find((item) => item.id === message.channelId)?.name || "channel")} ${esc(userDisplayLabel(users.get(message.authorId)) + ": " + message.text.slice(0, 80))}</button>`).join("") : `<div class="muted small">No results</div>`}</div>` : ""}
                </form>
              </section>
              <section class="section">
                <div class="section-head"><span>Members</span></div>
                <div class="list">
                  ${renderMemberRows(snap.users || [])}
                </div>
              </section>
            </aside>
          </div>
          ${renderSettingsMenuModal({ workspace, snap, role, isAdmin, askThane, billingPlan, isTeamPlan, privateChannels, inviteResult, currentUser: activeUser })}
          ${renderCliInstallModal()}`;
        requestAnimationFrame(() => {
          const scroller = document.querySelector(".messages");
          if (scroller) scroller.scrollTop = scroller.scrollHeight;
          const settingsModal = document.querySelector("[data-settings-modal]");
          if (settingsModal instanceof HTMLElement) settingsModal.scrollTop = settingsMenuScrollTop;
        });
      }

      function render() {
        if (!state.session?.authToken) renderLogin();
        else renderApp();
      }

      window.startLogin = startLogin;
      window.verifyLogin = verifyLogin;
      window.verifyMfa = verifyMfa;
      window.chooseWorkspace = chooseWorkspace;
      window.sendMessage = sendMessage;
      window.updateDraft = updateDraft;
      window.updateSearch = updateSearch;
      window.submitSearch = submitSearch;
      window.openSearchResult = openSearchResult;
      window.toggleSidebar = toggleSidebar;
      window.toggleMenu = toggleMenu;
      window.chooseChannel = chooseChannel;
      window.replyTo = replyTo;
      window.reactTo = reactTo;
      window.customReaction = customReaction;
      window.openReactionMenu = openReactionMenu;
      window.closeReactionMenu = closeReactionMenu;
      window.startLongPress = startLongPress;
      window.cancelLongPress = cancelLongPress;
      window.markTouchMoved = markTouchMoved;
      window.createWorkspace = createWorkspace;
      window.createChannel = createChannel;
      window.invite = invite;
      window.createInviteLink = createInviteLink;
      window.openBilling = openBilling;
      window.setAskThaneEnabled = setAskThaneEnabled;
      window.updateWorkspaceDisplayName = updateWorkspaceDisplayName;
      window.updateWorkspaceHandle = updateWorkspaceHandle;
      window.updateAccountDisplayName = updateAccountDisplayName;
      window.refreshMfaStatus = refreshMfaStatus;
      window.startMfaSetup = startMfaSetup;
      window.verifyMfaSetup = verifyMfaSetup;
      window.disableMfa = disableMfa;
      window.copyText = copyText;
      window.openSettingsMenu = openSettingsMenu;
      window.closeSettingsMenu = closeSettingsMenu;
      window.openCliInstall = openCliInstall;
      window.closeCliInstall = closeCliInstall;
      window.sync = sync;
      window.render = render;
      window.state = state;

      root.addEventListener("click", (event) => {
        const target = event.target instanceof Element ? event.target : null;
        const menuButton = target?.closest("[data-menu-toggle]");
        if (menuButton instanceof HTMLElement) {
          event.preventDefault();
          toggleMenu(menuButton.dataset.menuToggle || "");
          return;
        }
        const workspaceButton = target?.closest("[data-workspace-id]");
        if (workspaceButton instanceof HTMLElement) {
          event.preventDefault();
          void chooseWorkspace(workspaceButton.dataset.workspaceId || "");
          return;
        }
        const channelButton = target?.closest("[data-channel-id]");
        if (channelButton instanceof HTMLElement) {
          event.preventDefault();
          chooseChannel(channelButton.dataset.channelId || "");
        }
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (state.cliInstallOpen) closeCliInstall();
          else if (state.settingsMenuOpen) closeSettingsMenu();
        }
      });

      if (state.session?.authToken) {
        Promise.resolve()
          .then(() => state.inviteToken ? previewInvite().catch(() => {}) : undefined)
          .then(() => state.inviteToken ? acceptPendingInvite() : sync())
          .catch((error) => {
            state.error = error.message;
            if (!state.inviteToken) saveSession(null);
          })
          .finally(render);
        setInterval(() => {
          const composerActive = document.activeElement?.matches?.(".composer textarea");
          sync()
            .then(() => {
              if (composerActive && state.draftText) return;
              render();
            })
            .catch(() => {});
        }, 30000);
      } else {
        if (state.inviteToken) {
          previewInvite()
            .then(() => autoStartInviteLogin())
            .catch((error) => { state.error = error.message; })
            .finally(render);
        } else {
          render();
        }
      }
    </script>
  </body>
</html>
