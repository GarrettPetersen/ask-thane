<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thane Chat</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #d9e7dc;
        --muted: #819286;
        --quiet: #526055;
        --panel: #101612;
        --panel-2: #151d18;
        --line: #2f3b33;
        --field: #080c09;
        --green: #7aff9f;
        --amber: #ffc857;
        --cyan: #7dd3fc;
        --danger: #ff7a90;
        --shadow: rgba(0, 0, 0, 0.4);
        --rail-closed: 46px;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(rgba(122, 255, 159, 0.025) 1px, transparent 1px),
          #070a08;
        background-size: 100% 4px, auto;
        color: var(--ink);
      }

      button, input, textarea, select {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        background: #0a0f0c;
        color: var(--ink);
        min-height: 34px;
        padding: 0 12px;
        cursor: pointer;
      }

      button:hover { border-color: var(--green); color: var(--green); }
      button:disabled { color: var(--quiet); cursor: default; border-color: #202820; }
      input, textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--field);
        color: var(--ink);
        padding: 10px 11px;
        outline: none;
      }
      input:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 1px rgba(122, 255, 159, 0.18); }
      textarea { resize: none; min-height: 44px; max-height: 140px; }

      .app {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr) 310px;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        border: 1px solid rgba(122, 255, 159, 0.18);
      }
      .app.sidebar-collapsed {
        grid-template-columns: var(--rail-closed) minmax(0, 1fr) 310px;
      }

      .rail, .side, .main {
        min-height: 0;
        height: 100%;
      }
      .rail, .side {
        background: rgba(7, 12, 9, 0.96);
        border-right: 1px solid var(--line);
        overflow: auto;
      }
      .side { border-right: 0; border-left: 1px solid var(--line); }
      .rail {
        position: relative;
      }

      .brand {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }
      .sig {
        color: var(--green);
        white-space: pre;
        line-height: 1.05;
        font-size: 11px;
        margin-bottom: 12px;
        min-height: 82px;
      }
      .rail-tab {
        display: none;
        width: 100%;
        min-height: 100vh;
        padding: 10px 0;
        color: var(--green);
        background: transparent;
        border: 0;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        letter-spacing: 0;
      }
      .sidebar-collapsed .rail {
        overflow: hidden;
      }
      .sidebar-collapsed .rail-tab {
        display: block;
      }
      .sidebar-collapsed .brand,
      .sidebar-collapsed .section {
        display: none;
      }
      .title {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
      }
      h1, h2, h3, p { margin: 0; }
      h1 { font-size: 16px; color: var(--ink); }
      .state { color: var(--amber); font-size: 11px; }
      .muted { color: var(--muted); }
      .small { font-size: 12px; }

      .section {
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }
      .list { display: grid; gap: 6px; }
      .item {
        width: 100%;
        text-align: left;
        display: block;
        min-height: 34px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: transparent;
        border-color: transparent;
      }
      .item.active {
        border-color: var(--green);
        color: var(--green);
        background: rgba(122, 255, 159, 0.06);
      }
      .item .cursor {
        color: var(--amber);
      }

      .main {
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        min-width: 0;
        min-height: 0;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(7, 10, 8, 0.78);
      }
      .topbar-left {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon-button {
        width: 34px;
        padding: 0;
        text-align: center;
      }
      .channel-name { font-size: 18px; color: var(--green); }
      .prompt-line {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .messages {
        overflow: auto;
        min-height: 0;
        padding: 10px 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background:
          linear-gradient(90deg, rgba(122, 255, 159, 0.04) 1px, transparent 1px),
          transparent;
        background-size: 8px 100%;
      }
      .message {
        border: 0;
        border-left: 2px solid rgba(125, 211, 252, 0.38);
        background: rgba(8, 12, 9, 0.76);
        box-shadow: none;
        padding: 9px 10px;
      }
      .message.reply {
        margin-left: 18px;
        border-left-color: var(--amber);
        background: rgba(21, 29, 24, 0.5);
      }
      .message-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }
      .message-author { color: var(--cyan); }
      .message-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.45;
      }
      .message-actions, .reaction-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
        align-items: center;
      }
      .message-actions button, .reaction-row button {
        min-height: 28px;
        padding: 0 8px;
        font-size: 12px;
        background: transparent;
      }
      .reaction {
        border-color: rgba(125, 211, 252, 0.42);
        color: var(--cyan);
      }
      .custom-reaction {
        display: grid;
        grid-template-columns: minmax(74px, 96px) auto;
        gap: 6px;
      }
      .custom-reaction input {
        min-height: 28px;
        padding: 4px 7px;
      }
      .thread-count {
        color: var(--amber);
        font-size: 12px;
        margin-top: 8px;
      }
      .composer {
        border-top: 1px solid var(--line);
        padding: 10px 12px;
        background: rgba(7, 10, 8, 0.92);
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: end;
      }
      .composer-wrap {
        border-top: 1px solid var(--line);
        background: rgba(7, 10, 8, 0.92);
        position: sticky;
        bottom: 0;
        z-index: 10;
        box-shadow: 0 -12px 28px rgba(0, 0, 0, 0.24);
        min-height: 69px;
      }
      .composer-wrap .composer {
        border-top: 0;
      }
      .composer textarea {
        display: block;
        min-height: 44px;
      }
      .statusbar {
        border-top: 1px solid var(--line);
        padding: 6px 12px;
        color: var(--muted);
        background: #070a08;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
      }
      .statusbar strong {
        color: var(--green);
        font-weight: 400;
      }
      .reply-target {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        padding: 10px 12px 0;
        color: var(--amber);
        font-size: 12px;
      }

      .login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 22px;
      }
      .login-card {
        width: min(560px, 100%);
        border: 1px solid var(--line);
        background: rgba(16, 22, 18, 0.94);
        box-shadow: 0 30px 80px var(--shadow);
      }
      .login-card .brand { border-bottom: 1px solid var(--line); }
      .login-form { padding: 18px; display: grid; gap: 12px; }
      .row { display: grid; gap: 7px; }
      label { color: var(--muted); font-size: 12px; }
      .error { color: var(--danger); min-height: 18px; }
      .ok { color: var(--green); }

      .side .section { border-bottom: 1px solid var(--line); }
      .kv { display: grid; gap: 8px; font-size: 12px; color: var(--muted); }
      .cmdline {
        border: 1px solid var(--line);
        background: var(--field);
        padding: 10px;
        color: var(--green);
        overflow-wrap: anywhere;
      }
      .empty {
        border: 1px dashed var(--line);
        color: var(--muted);
        padding: 18px;
        text-align: center;
      }

      @media (max-width: 980px) {
        .app { grid-template-columns: 230px minmax(0, 1fr); }
        .app.sidebar-collapsed { grid-template-columns: var(--rail-closed) minmax(0, 1fr); }
        .side { display: none; }
      }
      @media (max-width: 720px) {
        body { overflow: auto; }
        .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; }
        .app.sidebar-collapsed { grid-template-columns: 1fr; }
        .sidebar-collapsed .rail { display: none; }
        .rail { min-height: auto; border-right: 0; }
        .rail, .side, .main { height: auto; }
        .main { min-height: 72vh; }
        .brand { padding: 14px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const API = "https://api.askthane.com";
      const storageKey = "thane.web.session";
      const root = document.querySelector("#root");
      const state = {
        session: JSON.parse(localStorage.getItem(storageKey) || "null"),
        authStep: "email",
        email: "",
        mfaChallengeToken: "",
        snapshot: null,
        activeWorkspaceId: "",
        activeChannelId: "",
        replyToId: "",
        draftText: "",
        sidebarCollapsed: localStorage.getItem("thane.web.sidebarCollapsed") === "true",
        status: "",
        error: "",
        busy: false
      };

      function saveSession(session) {
        state.session = session;
        if (session) localStorage.setItem(storageKey, JSON.stringify(session));
        else localStorage.removeItem(storageKey);
      }

      async function api(path, options = {}) {
        const headers = { "content-type": "application/json", ...(options.headers || {}) };
        if (state.session?.authToken) headers.authorization = `Bearer ${state.session.authToken}`;
        const res = await fetch(`${API}${path}`, { ...options, headers });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || body.ok === false) throw new Error(body.error || `HTTP ${res.status}`);
        return body;
      }

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      }
      function jsString(value) {
        return JSON.stringify(String(value ?? "")).replace(/</g, "\\u003c");
      }
      function time(value) {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? value : date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }
      const quickReactions = ["👍", "👀", "✅", "🔥", "❤️", "😂"];

      function currentSnapshot() {
        return state.snapshot || { workspaces: [], channels: [], messages: [], users: [] };
      }

      function currentChannel() {
        const snap = currentSnapshot();
        return snap.channels.find((item) => item.id === state.activeChannelId) || snap.channels[0];
      }

      function currentMessages() {
        const channel = currentChannel();
        return (currentSnapshot().messages || []).filter((message) => message.channelId === channel?.id);
      }

      function messageById(id) {
        return (currentSnapshot().messages || []).find((message) => message.id === id);
      }

      function reactionGroups(message) {
        const groups = new Map();
        for (const reaction of message.reactions || []) {
          const group = groups.get(reaction.emoji) || { emoji: reaction.emoji, count: 0, by: [] };
          group.count += 1;
          if (reaction.by) group.by.push(reaction.by);
          groups.set(reaction.emoji, group);
        }
        return [...groups.values()];
      }

      function workspaceInitials(workspace) {
        const source = workspace?.name || workspace?.slug || "chat";
        const words = source.split(/[^a-zA-Z0-9]+/).filter(Boolean);
        return (words.length > 1 ? words.map((word) => word[0]).join("") : source).slice(0, 4).toUpperCase();
      }

      function generatedCrest(workspace) {
        const slug = (workspace?.slug || "chat").slice(0, 16);
        const initials = workspaceInitials(workspace).padEnd(4, " ");
        return [
          "╭────────────╮",
          `│ ${initials}       │`,
          "│  THANE     │",
          "╰────────────╯",
          slug
        ].join("\n");
      }

      function workspaceCrest(workspace) {
        return (workspace?.asciiArt || "").trim() || generatedCrest(workspace);
      }

      function toggleSidebar() {
        state.sidebarCollapsed = !state.sidebarCollapsed;
        localStorage.setItem("thane.web.sidebarCollapsed", String(state.sidebarCollapsed));
        render();
      }

      async function startLogin(event) {
        event.preventDefault();
        state.busy = true; state.error = ""; state.status = "";
        render();
        const form = new FormData(event.currentTarget);
        state.email = String(form.get("email") || "").trim();
        try {
          await api("/v1/thane-cli/auth/start", {
            method: "POST",
            body: JSON.stringify({ email: state.email, displayName: state.email.split("@")[0] })
          });
          state.authStep = "code";
          state.status = `Code sent to ${state.email}`;
        } catch (error) {
          state.error = error.message;
        } finally {
          state.busy = false; render();
        }
      }

      async function verifyLogin(event) {
        event.preventDefault();
        state.busy = true; state.error = "";
        render();
        const code = String(new FormData(event.currentTarget).get("code") || "").trim();
        try {
          const body = await api("/v1/thane-cli/auth/verify", {
            method: "POST",
            body: JSON.stringify({ email: state.email, code })
          });
          if (body.mfaRequired) {
            state.authStep = "mfa";
            state.mfaChallengeToken = body.mfaChallengeToken;
            state.status = "Enter your authenticator code.";
          } else {
            saveSession(body.account);
            await sync();
          }
        } catch (error) {
          state.error = error.message;
        } finally {
          state.busy = false; render();
        }
      }

      async function verifyMfa(event) {
        event.preventDefault();
        state.busy = true; state.error = "";
        render();
        const code = String(new FormData(event.currentTarget).get("code") || "").trim();
        try {
          const body = await api("/v1/thane-cli/auth/mfa-verify", {
            method: "POST",
            body: JSON.stringify({ challengeToken: state.mfaChallengeToken, code })
          });
          saveSession(body.account);
          await sync();
        } catch (error) {
          state.error = error.message;
        } finally {
          state.busy = false; render();
        }
      }

      async function sync() {
        if (!state.session?.authToken) return;
        const workspaceId = state.activeWorkspaceId ? `?workspaceId=${encodeURIComponent(state.activeWorkspaceId)}` : "";
        const snapshot = await api(`/v1/thane-cli/sync${workspaceId}`);
        state.snapshot = snapshot;
        state.activeWorkspaceId = snapshot.activeWorkspaceId || snapshot.workspaces?.[0]?.id || "";
        if (!state.activeChannelId || !snapshot.channels?.some((channel) => channel.id === state.activeChannelId)) {
          state.activeChannelId = snapshot.channels?.find((channel) => channel.name === "general")?.id || snapshot.channels?.[0]?.id || "";
        }
      }

      async function chooseWorkspace(id) {
        state.activeWorkspaceId = id;
        state.activeChannelId = "";
        state.replyToId = "";
        await sync();
        render();
      }

      async function sendMessage(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const text = String(state.draftText || form.get("text") || "").trim();
        if (!text || !state.activeChannelId) return;
        event.currentTarget.reset();
        state.draftText = "";
        const replyTarget = messageById(state.replyToId);
        const threadRootId = replyTarget ? (replyTarget.threadRootId || replyTarget.id) : "";
        await api("/v1/thane-cli/messages", {
          method: "POST",
          body: JSON.stringify({
            workspaceId: state.activeWorkspaceId,
            channelId: state.activeChannelId,
            text,
            source: "chat",
            ...(threadRootId ? { threadRootId } : {})
          })
        });
        state.replyToId = "";
        await sync();
        render();
      }

      function replyTo(id) {
        state.replyToId = id;
        render();
        requestAnimationFrame(() => document.querySelector(".composer textarea")?.focus());
      }

      function updateDraft(value) {
        state.draftText = value;
      }

      async function reactTo(messageId, emoji) {
        if (!messageId || !emoji) return;
        await api("/v1/thane-cli/reactions", {
          method: "POST",
          body: JSON.stringify({ workspaceId: state.activeWorkspaceId, messageId, emoji })
        });
        await sync();
        render();
      }

      async function customReaction(event, messageId) {
        event.preventDefault();
        const input = event.currentTarget.querySelector("input");
        const emoji = String(input?.value || "").trim();
        if (!emoji) return;
        event.currentTarget.reset();
        await reactTo(messageId, emoji);
      }

      async function createChannel(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const name = String(form.get("name") || "").trim();
        if (!name) return;
        event.currentTarget.reset();
        await api("/v1/thane-cli/channels", {
          method: "POST",
          body: JSON.stringify({ workspaceId: state.activeWorkspaceId, name })
        });
        await sync();
        state.activeChannelId = state.snapshot.channels.find((channel) => channel.name === name.replace(/^#/, "").toLowerCase())?.id || state.activeChannelId;
        render();
      }

      async function createWorkspace(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const rawName = String(form.get("name") || "").trim();
        const rawSlug = String(form.get("slug") || "").trim();
        if (!rawName && !rawSlug) return;
        event.currentTarget.reset();
        const workspaceSlug = (rawSlug || rawName)
          .toLowerCase()
          .replace(/[^a-z0-9._-]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 60);
        const workspaceName = rawName || workspaceSlug;
        const body = await api("/v1/thane-cli/workspaces", {
          method: "POST",
          body: JSON.stringify({ workspaceSlug, workspaceName })
        });
        state.activeWorkspaceId = body.workspace?.id || state.activeWorkspaceId;
        state.activeChannelId = "";
        state.replyToId = "";
        await sync();
        render();
      }

      async function invite(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const email = String(form.get("email") || "").trim();
        if (!email) return;
        event.currentTarget.reset();
        const workspace = state.snapshot.workspaces.find((item) => item.id === state.activeWorkspaceId);
        if (!workspace) return;
        await api("/v1/thane-cli/workspace-invites", {
          method: "POST",
          body: JSON.stringify({
            workspaceId: workspace.id,
            workspaceSlug: workspace.slug,
            workspaceName: workspace.name,
            inviteeEmail: email,
            role: "member",
            maxUses: 1
          })
        });
        state.status = `Invite sent to ${email}`;
        render();
      }

      function renderLogin() {
        const codeForm = state.authStep === "code" || state.authStep === "mfa";
        root.innerHTML = `
          <main class="login">
            <section class="login-card">
              <div class="brand">
                <div class="sig">╭─ THANE CHAT ─╮\n│              │\n╰─ ONLINE     ─╯</div>
                <div class="title"><h1>Sign in</h1><span class="state">hosted</span></div>
              </div>
              <form class="login-form" onsubmit="${codeForm ? (state.authStep === "mfa" ? "verifyMfa(event)" : "verifyLogin(event)") : "startLogin(event)"}">
                ${codeForm ? `<p class="muted small">${esc(state.status)}</p>` : ""}
                <div class="row">
                  <label>${codeForm ? (state.authStep === "mfa" ? "Authenticator code" : "Email code") : "Email"}</label>
                  <input name="${codeForm ? "code" : "email"}" autocomplete="${codeForm ? "one-time-code" : "email"}" required ${state.busy ? "disabled" : ""} />
                </div>
                <button ${state.busy ? "disabled" : ""}>${codeForm ? "Verify" : "Send code"}</button>
                <p class="error small">${esc(state.error)}</p>
              </form>
            </section>
          </main>`;
      }

      function renderMessage(message, users, repliesByRoot, isReply = false) {
        const user = users.get(message.authorId);
        const replies = repliesByRoot.get(message.id) || [];
        const groups = reactionGroups(message);
        return `<article class="message ${isReply ? "reply" : ""}">
          <div class="message-meta">
            <span class="message-author">@${esc(user?.handle || "unknown")}</span>
            <span>${esc(time(message.createdAt))}</span>
          </div>
          <div class="message-text">${esc(message.text)}</div>
          ${replies.length && !isReply ? `<div class="thread-count">${replies.length} repl${replies.length === 1 ? "y" : "ies"}</div>` : ""}
          <div class="reaction-row">
            ${groups.map((group) => `<button class="reaction" title="${esc(group.by.join(", "))}" onclick="reactTo(${jsString(message.id)}, ${jsString(group.emoji)})">${esc(group.emoji)} ${group.count}</button>`).join("")}
          </div>
          <div class="message-actions">
            <button onclick="replyTo(${jsString(message.id)})">reply</button>
            ${quickReactions.map((emoji) => `<button onclick="reactTo(${jsString(message.id)}, ${jsString(emoji)})">${emoji}</button>`).join("")}
            <form class="custom-reaction" onsubmit="customReaction(event, ${jsString(message.id)})">
              <input name="emoji" aria-label="Custom reaction" placeholder="+ emoji" />
              <button>react</button>
            </form>
          </div>
          ${!isReply && replies.length ? replies.map((reply) => renderMessage(reply, users, repliesByRoot, true)).join("") : ""}
        </article>`;
      }

      function renderApp() {
        const snap = state.snapshot || { workspaces: [], channels: [], messages: [], users: [] };
        const workspace = snap.workspaces.find((item) => item.id === state.activeWorkspaceId) || snap.workspaces[0];
        const channel = snap.channels.find((item) => item.id === state.activeChannelId) || snap.channels[0];
        const users = new Map((snap.users || []).map((user) => [user.id, user]));
        const messages = (snap.messages || []).filter((message) => message.channelId === channel?.id);
        const repliesByRoot = new Map();
        for (const message of messages) {
          if (!message.threadRootId) continue;
          const replies = repliesByRoot.get(message.threadRootId) || [];
          replies.push(message);
          repliesByRoot.set(message.threadRootId, replies);
        }
        const rootMessages = messages.filter((message) => !message.threadRootId);
        const replyTarget = messageById(state.replyToId);
        root.innerHTML = `
          <div class="app ${state.sidebarCollapsed ? "sidebar-collapsed" : ""}">
            <aside class="rail">
              <button class="rail-tab" onclick="toggleSidebar()" title="Expand sidebar">THANE / ${esc(workspace?.slug || "chat")}</button>
              <div class="brand">
                <div class="sig">${esc(workspaceCrest(workspace))}</div>
                <div class="title"><h1>Thane Chat</h1><span class="state">online</span></div>
                <p class="muted small">${esc(state.session.email)}</p>
              </div>
              <section class="section">
                <div class="section-head"><span>Workspaces</span><button onclick="sync().then(render)">sync</button></div>
                <div class="list">${snap.workspaces.map((item) => `<button class="item ${item.id === state.activeWorkspaceId ? "active" : ""}" onclick="chooseWorkspace(${jsString(item.id)})"><span class="cursor">${item.id === state.activeWorkspaceId ? ">" : " "}</span> ${esc(item.slug)}</button>`).join("") || `<div class="empty">No workspaces yet</div>`}</div>
              </section>
              <section class="section">
                <div class="section-head"><span>Channels</span></div>
                <div class="list">${snap.channels.map((item) => `<button class="item ${item.id === state.activeChannelId ? "active" : ""}" onclick="state.activeChannelId=${jsString(item.id)}; state.replyToId=''; render()"><span class="cursor">${item.id === state.activeChannelId ? ">" : " "}</span> #${esc(item.name)}</button>`).join("") || `<div class="empty">No channels yet</div>`}</div>
              </section>
            </aside>
            <main class="main">
              <header class="topbar">
                <div class="topbar-left">
                  <button class="icon-button" onclick="toggleSidebar()" title="${state.sidebarCollapsed ? "Expand sidebar" : "Collapse sidebar"}">${state.sidebarCollapsed ? ">" : "<"}</button>
                  <div>
                    <h2 class="channel-name">#${esc(channel?.name || "general")}</h2>
                    <p class="prompt-line">thane://${esc(workspace?.slug || "chat")}/${esc(channel?.name || "general")}</p>
                  </div>
                </div>
                <button onclick="saveSession(null); location.reload()">sign out</button>
              </header>
              <section class="messages">
                ${rootMessages.length ? rootMessages.map((message) => renderMessage(message, users, repliesByRoot)).join("") : `<div class="empty">No messages in this channel yet.</div>`}
              </section>
              <div class="statusbar"><span><strong>${esc(workspace?.slug || "chat")}</strong> / #${esc(channel?.name || "general")}</span><span>${messages.length} msg${messages.length === 1 ? "" : "s"} · sync 5s</span></div>
              <div class="composer-wrap">
                ${replyTarget ? `<div class="reply-target"><span>replying to @${esc(users.get(replyTarget.authorId)?.handle || "unknown")}: ${esc(replyTarget.text.slice(0, 80))}</span><button onclick="state.replyToId=''; render()">cancel</button></div>` : ""}
                <form class="composer" onsubmit="sendMessage(event)">
                  <textarea name="text" oninput="updateDraft(this.value)" placeholder="${replyTarget ? "Type a reply" : `Type a message for #${esc(channel?.name || "general")}`}">${esc(state.draftText)}</textarea>
                  <button>${replyTarget ? "reply" : "send"}</button>
                </form>
              </div>
            </main>
            <aside class="side">
              <section class="section">
                <div class="section-head"><span>Workspace</span></div>
                <div class="kv">
                  <div class="cmdline">${esc(workspace?.name || "No workspace")}</div>
                  <div>${snap.users.length} member${snap.users.length === 1 ? "" : "s"}</div>
                  <div>${snap.channels.length} channel${snap.channels.length === 1 ? "" : "s"}</div>
                  <div class="${state.status ? "ok" : "muted"}">${esc(state.status || "Ready")}</div>
                </div>
              </section>
              <section class="section">
                <div class="section-head"><span>New workspace</span></div>
                <form class="list" onsubmit="createWorkspace(event)">
                  <input name="name" placeholder="Thane Internal" />
                  <input name="slug" placeholder="thane-internal" />
                  <button>Create workspace</button>
                </form>
              </section>
              <section class="section">
                <div class="section-head"><span>New channel</span></div>
                <form class="list" onsubmit="createChannel(event)">
                  <input name="name" placeholder="book-club" />
                  <button>Create channel</button>
                </form>
              </section>
              <section class="section">
                <div class="section-head"><span>Invite</span></div>
                <form class="list" onsubmit="invite(event)">
                  <input name="email" type="email" placeholder="friend@example.com" />
                  <button>Email invite</button>
                </form>
              </section>
            </aside>
          </div>`;
        requestAnimationFrame(() => {
          const scroller = document.querySelector(".messages");
          if (scroller) scroller.scrollTop = scroller.scrollHeight;
        });
      }

      function render() {
        if (!state.session?.authToken) renderLogin();
        else renderApp();
      }

      window.startLogin = startLogin;
      window.verifyLogin = verifyLogin;
      window.verifyMfa = verifyMfa;
      window.chooseWorkspace = chooseWorkspace;
      window.sendMessage = sendMessage;
      window.updateDraft = updateDraft;
      window.toggleSidebar = toggleSidebar;
      window.replyTo = replyTo;
      window.reactTo = reactTo;
      window.customReaction = customReaction;
      window.createWorkspace = createWorkspace;
      window.createChannel = createChannel;
      window.invite = invite;
      window.sync = sync;
      window.render = render;
      window.state = state;

      if (state.session?.authToken) {
        sync().catch((error) => { state.error = error.message; saveSession(null); }).finally(render);
        setInterval(() => {
          const composerActive = document.activeElement?.matches?.(".composer textarea");
          sync()
            .then(() => {
              if (composerActive && state.draftText) return;
              render();
            })
            .catch(() => {});
        }, 5000);
      } else {
        render();
      }
    </script>
  </body>
</html>
