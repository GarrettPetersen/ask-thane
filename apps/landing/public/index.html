<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thane | Choose Your Product</title>
    <meta name="description" content="Choose Thane Chat or Ask Thane." />
    <meta name="theme-color" content="#f7f3ea" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      :root {
        --bg: #f7f3ea;
        --ink: #141414;
        --muted: #5f5b54;
        --brand: #0f5fd7;
        --brand-dark: #0848a6;
        --accent: #c95d2e;
        --surface: #fffdf8;
        --border: #e5dccb;
        --shadow: rgba(28, 40, 62, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background:
          linear-gradient(135deg, rgba(248, 240, 226, 0.9), rgba(228, 237, 250, 0.72)),
          var(--bg);
      }

      .shell {
        width: min(980px, 100% - 2rem);
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 0 28px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 18px;
      }

      header {
        display: flex;
        justify-content: center;
      }

      .brand {
        display: inline-flex;
      }

      .brand-mark {
        width: 156px;
        max-width: 100%;
        height: auto;
      }

      main {
        display: grid;
        align-content: center;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 5vw, 3.6rem);
        line-height: 1;
        text-align: center;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .product-choice {
        min-height: 320px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: inherit;
        text-decoration: none;
        padding: 22px;
        display: grid;
        align-content: space-between;
        gap: 18px;
        box-shadow: 0 18px 48px var(--shadow);
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          border-color 160ms ease;
      }

      .product-choice:hover {
        transform: translateY(-3px);
        border-color: #9dc0f9;
        box-shadow: 0 24px 62px rgba(15, 95, 215, 0.18);
      }

      .product-choice:focus-visible {
        outline: 3px solid #9dc0f9;
        outline-offset: 4px;
      }

      .product-choice.chat {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(246, 250, 255, 0.96)),
          var(--surface);
      }

      .product-choice.ask {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(255, 249, 240, 0.96)),
          var(--surface);
      }

      .product-logo {
        width: 132px;
        max-width: 100%;
        height: auto;
      }

      .chat .product-logo {
        width: 112px;
      }

      h2 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1;
      }

      p {
        margin: 10px 0 0;
        max-width: 28ch;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      footer {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 0.92rem;
      }

      footer a {
        color: var(--brand-dark);
      }

      @media (max-width: 760px) {
        .shell {
          width: min(520px, 100% - 1.5rem);
        }

        .product-grid {
          grid-template-columns: 1fr;
        }

        .product-choice {
          min-height: 240px;
        }
      }
    </style>
    <link rel="stylesheet" href="/site-modern.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="/">
          <img class="brand-mark" src="/brand/ask-thane-gray-logo-with-text.svg" alt="Thane" />
        </a>
      </header>

      <main>
        <h1>Choose a product.</h1>

        <section class="product-grid" aria-label="Product choices">
          <a class="product-choice chat" href="/chat">
            <img class="product-logo" src="/brand/thane-chat-gray-logo-with-text.svg" alt="Thane Chat" />
            <div>
              <h2>Thane Chat</h2>
              <p>agent-first chat application.</p>
            </div>
          </a>

          <a class="product-choice ask" href="/ask-thane">
            <img class="product-logo" src="/brand/ask-thane-gray-logo-with-text.svg" alt="Ask Thane" />
            <div>
              <h2>Ask Thane</h2>
              <p>Follow-up for team conversations.</p>
            </div>
          </a>
        </section>
      </main>

      <footer>
        <a href="/install">Install</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/privacy.html">Privacy</a>
        <a href="/terms.html">Terms</a>
      </footer>
    </div>
  </body>
</html>
