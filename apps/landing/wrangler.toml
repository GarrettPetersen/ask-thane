name = "ask-thane"
compatibility_date = "2026-05-08"
main = "src/index.ts"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
run_worker_first = true

[[routes]]
pattern = "askthane.com"
custom_domain = true

[[routes]]
pattern = "www.askthane.com"
custom_domain = true

[[routes]]
pattern = "chat.askthane.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "ask-thane"
database_id = "186fcae1-759c-45df-a63a-2d68e53cac2d"
