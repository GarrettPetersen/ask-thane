name: Deploy Workers Production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "master"
        type: string
      deploy_bot:
        description: "Deploy bot-worker"
        required: false
        default: true
        type: boolean
      deploy_api:
        description: "Deploy api-worker"
        required: false
        default: true
        type: boolean
      deploy_payments:
        description: "Deploy payments-worker"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-workers-production
  cancel-in-progress: false

jobs:
  deploy-bot:
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_bot }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Deploy bot-worker (production)
        working-directory: apps/bot-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy --env production \
            --var BUILD_GIT_SHA="$GIT_SHA" \
            --var BUILD_ENV="production" \
            --var BUILD_DEPLOYED_AT="$DEPLOYED_AT"

  deploy-api:
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_api }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Deploy api-worker (production)
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy --env production \
            --var BUILD_GIT_SHA="$GIT_SHA" \
            --var BUILD_ENV="production" \
            --var BUILD_DEPLOYED_AT="$DEPLOYED_AT"

  deploy-payments:
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_payments }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Deploy payments-worker (production)
        working-directory: apps/payments-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy --env production \
            --var BUILD_GIT_SHA="$GIT_SHA" \
            --var BUILD_ENV="production" \
            --var BUILD_DEPLOYED_AT="$DEPLOYED_AT"
