name: Deploy Workers Production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "master"
        type: string
      deploy_bot:
        description: "Deploy bot-worker"
        required: false
        default: true
        type: boolean
      deploy_api:
        description: "Deploy api-worker"
        required: false
        default: true
        type: boolean
      deploy_payments:
        description: "Deploy payments-worker"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-workers-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve deploy SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-staging:
    runs-on: ubuntu-latest
    needs: resolve-ref
    if: ${{ inputs.deploy_bot || inputs.deploy_api || inputs.deploy_payments }}
    steps:
      - name: Require successful staging workflow run for target SHA
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = "${{ needs.resolve-ref.outputs.sha }}";
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "deploy-workers-staging.yml",
              head_sha: sha,
              per_page: 20
            });

            const success = runs.data.workflow_runs.find((run) => run.conclusion === "success");
            if (!success) {
              core.setFailed(`No successful Deploy Workers Staging run found for commit ${sha}. Production deploy is blocked.`);
              return;
            }

            core.info(`Staging gate passed via run #${success.run_number} (${success.html_url}).`);

  test-suite:
    runs-on: ubuntu-latest
    needs: resolve-ref
    if: ${{ inputs.deploy_bot || inputs.deploy_api || inputs.deploy_payments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Run Test Suite
        run: pnpm test

  apply-migrations:
    runs-on: ubuntu-latest
    needs: [resolve-ref, verify-staging, test-suite]
    if: ${{ inputs.deploy_bot || inputs.deploy_api }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate migrations are non-destructive
        run: node scripts/check-d1-migrations-nondestructive.mjs

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Apply D1 migrations (production)
        working-directory: apps/bot-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --env production --remote

      - name: Verify D1 migration state (production)
        working-directory: apps/bot-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations list DB --env production --remote

  deploy-bot:
    runs-on: ubuntu-latest
    needs: [resolve-ref, verify-staging, test-suite, apply-migrations]
    if: ${{ inputs.deploy_bot }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Deploy bot-worker (production)
        working-directory: apps/bot-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy --env production \
            --var "BUILD_GIT_SHA:$GIT_SHA" \
            --var "BUILD_ENV:production" \
            --var "BUILD_DEPLOYED_AT:$DEPLOYED_AT"

  deploy-api:
    runs-on: ubuntu-latest
    needs: [resolve-ref, verify-staging, test-suite, apply-migrations]
    if: ${{ inputs.deploy_api }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Deploy api-worker (production)
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy --env production \
            --var "BUILD_GIT_SHA:$GIT_SHA" \
            --var "BUILD_ENV:production" \
            --var "BUILD_DEPLOYED_AT:$DEPLOYED_AT"

  deploy-payments:
    runs-on: ubuntu-latest
    needs: [resolve-ref, verify-staging, test-suite]
    if: ${{ inputs.deploy_payments }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Deploy payments-worker (production)
        working-directory: apps/payments-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy --env production \
            --var "BUILD_GIT_SHA:$GIT_SHA" \
            --var "BUILD_ENV:production" \
            --var "BUILD_DEPLOYED_AT:$DEPLOYED_AT"
