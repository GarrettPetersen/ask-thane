name: Deploy Workers Production

on:
  workflow_run:
    workflows: ["Deploy Workers Staging"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "master"
        type: string
      deploy_bot:
        description: "Deploy bot-worker"
        required: false
        default: true
        type: boolean
      deploy_api:
        description: "Deploy api-worker"
        required: false
        default: true
        type: boolean
      deploy_payments:
        description: "Deploy payments-worker"
        required: false
        default: false
        type: boolean
      deploy_landing:
        description: "Deploy landing worker"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-workers-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.git_ref }}

      - name: Resolve deploy SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  detect-targets:
    runs-on: ubuntu-latest
    needs: resolve-ref
    outputs:
      bot: ${{ steps.detect.outputs.bot }}
      api: ${{ steps.detect.outputs.api }}
      payments: ${{ steps.detect.outputs.payments }}
      landing: ${{ steps.detect.outputs.landing }}
    steps:
      - name: Detect manual deploy targets
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          MANUAL_DEPLOY_BOT: ${{ inputs.deploy_bot || false }}
          MANUAL_DEPLOY_API: ${{ inputs.deploy_api || false }}
          MANUAL_DEPLOY_PAYMENTS: ${{ inputs.deploy_payments || false }}
          MANUAL_DEPLOY_LANDING: ${{ inputs.deploy_landing || false }}
        run: |
          echo "bot=$MANUAL_DEPLOY_BOT" >> "$GITHUB_OUTPUT"
          echo "api=$MANUAL_DEPLOY_API" >> "$GITHUB_OUTPUT"
          echo "payments=$MANUAL_DEPLOY_PAYMENTS" >> "$GITHUB_OUTPUT"
          echo "landing=$MANUAL_DEPLOY_LANDING" >> "$GITHUB_OUTPUT"

      - name: Detect staged deploy targets
        id: staged
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run_id = context.payload.workflow_run.id;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id,
              per_page: 100
            });

            const succeeded = new Set(
              jobs
                .filter((job) => job.conclusion === "success")
                .map((job) => job.name)
            );
            const bot = succeeded.has("deploy-bot");
            const chatApp = succeeded.has("deploy-api") || succeeded.has("deploy-landing");

            core.setOutput("bot", bot ? "true" : "false");
            core.setOutput("api", chatApp ? "true" : "false");
            core.setOutput("payments", "false");
            core.setOutput("landing", chatApp ? "true" : "false");

            if (bot || chatApp) {
              core.info(`Production promotion targets: bot=${bot}, api=${chatApp}, landing=${chatApp}.`);
            } else {
              core.info("Staging did not deploy bot, API, or landing; production promotion is skipped.");
            }

      - name: Set production deploy targets
        id: detect
        shell: bash
        env:
          MANUAL_BOT: ${{ steps.manual.outputs.bot }}
          MANUAL_API: ${{ steps.manual.outputs.api }}
          MANUAL_PAYMENTS: ${{ steps.manual.outputs.payments }}
          MANUAL_LANDING: ${{ steps.manual.outputs.landing }}
          STAGED_BOT: ${{ steps.staged.outputs.bot }}
          STAGED_API: ${{ steps.staged.outputs.api }}
          STAGED_PAYMENTS: ${{ steps.staged.outputs.payments }}
          STAGED_LANDING: ${{ steps.staged.outputs.landing }}
        run: |
          echo "bot=${MANUAL_BOT:-${STAGED_BOT:-false}}" >> "$GITHUB_OUTPUT"
          echo "api=${MANUAL_API:-${STAGED_API:-false}}" >> "$GITHUB_OUTPUT"
          echo "payments=${MANUAL_PAYMENTS:-${STAGED_PAYMENTS:-false}}" >> "$GITHUB_OUTPUT"
          echo "landing=${MANUAL_LANDING:-${STAGED_LANDING:-false}}" >> "$GITHUB_OUTPUT"

  verify-staging:
    runs-on: ubuntu-latest
    needs: [resolve-ref, detect-targets]
    if: >
      needs.detect-targets.outputs.bot == 'true' ||
      needs.detect-targets.outputs.api == 'true' ||
      needs.detect-targets.outputs.payments == 'true' ||
      needs.detect-targets.outputs.landing == 'true'
    steps:
      - name: Accept triggering staging workflow run
        if: ${{ github.event_name == 'workflow_run' }}
        run: echo "Staging gate passed via ${{ github.event.workflow_run.html_url }}."

      - name: Require successful staging workflow run for target SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = "${{ needs.resolve-ref.outputs.sha }}";
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "deploy-workers-staging.yml",
              head_sha: sha,
              per_page: 20
            });

            const success = runs.data.workflow_runs.find((run) => run.conclusion === "success");
            if (!success) {
              core.setFailed(`No successful Deploy Workers Staging run found for commit ${sha}. Production deploy is blocked.`);
              return;
            }

            core.info(`Staging gate passed via run #${success.run_number} (${success.html_url}).`);

  test-suite:
    runs-on: ubuntu-latest
    needs: [resolve-ref, detect-targets]
    if: >
      needs.detect-targets.outputs.bot == 'true' ||
      needs.detect-targets.outputs.api == 'true' ||
      needs.detect-targets.outputs.payments == 'true' ||
      needs.detect-targets.outputs.landing == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Run Test Suite
        run: pnpm test

  apply-migrations:
    runs-on: ubuntu-latest
    needs: [resolve-ref, detect-targets, verify-staging, test-suite]
    if: >
      needs.detect-targets.outputs.bot == 'true' ||
      needs.detect-targets.outputs.api == 'true'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate migrations are non-destructive
        run: node scripts/check-d1-migrations-nondestructive.mjs

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Apply D1 migrations (production)
        working-directory: apps/bot-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --env production --remote

      - name: Verify D1 migration state (production)
        working-directory: apps/bot-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations list DB --env production --remote

  deploy-bot:
    runs-on: ubuntu-latest
    needs: [resolve-ref, detect-targets, verify-staging, test-suite, apply-migrations]
    if: ${{ needs.detect-targets.outputs.bot == 'true' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Deploy bot-worker (production)
        working-directory: apps/bot-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy --env production \
            --var "BUILD_GIT_SHA:$GIT_SHA" \
            --var "BUILD_ENV:production" \
            --var "BUILD_DEPLOYED_AT:$DEPLOYED_AT"

  deploy-api:
    runs-on: ubuntu-latest
    needs: [resolve-ref, detect-targets, verify-staging, test-suite, apply-migrations]
    if: ${{ needs.detect-targets.outputs.api == 'true' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Deploy api-worker (production)
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy --env production \
            --var "BUILD_GIT_SHA:$GIT_SHA" \
            --var "BUILD_ENV:production" \
            --var "BUILD_DEPLOYED_AT:$DEPLOYED_AT"

  deploy-payments:
    runs-on: ubuntu-latest
    needs: [resolve-ref, detect-targets, verify-staging, test-suite]
    if: ${{ needs.detect-targets.outputs.payments == 'true' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Deploy payments-worker (production)
        working-directory: apps/payments-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy --env production \
            --var "BUILD_GIT_SHA:$GIT_SHA" \
            --var "BUILD_ENV:production" \
            --var "BUILD_DEPLOYED_AT:$DEPLOYED_AT"

  deploy-landing:
    runs-on: ubuntu-latest
    needs: [resolve-ref, detect-targets, verify-staging, test-suite]
    if: ${{ needs.detect-targets.outputs.landing == 'true' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Deploy landing worker (production)
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy --env production \
            --var "BUILD_GIT_SHA:$GIT_SHA" \
            --var "BUILD_ENV:production" \
            --var "BUILD_DEPLOYED_AT:$DEPLOYED_AT"
